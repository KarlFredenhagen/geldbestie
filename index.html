<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geldbestie</title>
<meta name="theme-color" content="#f3f8f4" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0d1a12" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--g:#16a34a;--gd:#15803d;--bg:#f3f8f4;--card:#fff;--line:#d5e5da;--tx:#10281a;--mut:#5f7a69}
@media(prefers-color-scheme:dark){:root{--g:#22c55e;--gd:#4ade80;--bg:#0d1a12;--card:#14261b;--line:#26402f;--tx:#e6f3ea;--mut:#8fae9a}}
*{box-sizing:border-box}
html{overscroll-behavior-y:none;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg)}
h1{margin:0;font-size:1.25rem;letter-spacing:-.01em;color:var(--gd)}
.ib{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--gd)}
main{padding:4px 16px 120px;max-width:640px;margin:auto}
.row{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:12px 14px;margin-bottom:10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px}
.row b{font-weight:600;overflow-wrap:anywhere}
.row .cat{grid-column:1;color:var(--mut);font-size:.85rem}
.row .amt{grid-row:1/3;grid-column:2;font-weight:700;font-variant-numeric:tabular-nums}
.row button{grid-row:1/3;grid-column:3;width:36px;height:36px;border:0;background:none;color:var(--mut);display:grid;place-items:center;border-radius:10px}
.empty{text-align:center;color:var(--mut);margin-top:22vh}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(22,163,74,.4)}
.fab svg{width:30px;height:30px;stroke-width:2.5}
dialog{border:0;padding:20px;width:min(480px,100%);max-width:100%;margin:auto auto 0;border-radius:24px 24px 0 0;background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.4)}
@media(min-width:600px){dialog{margin:auto;border-radius:24px}}
h2{margin:0 0 14px;font-size:1.15rem}
label{display:block;margin-bottom:12px;font-size:.85rem;color:var(--mut)}
input{display:block;width:100%;margin-top:4px;padding:12px;font:inherit;font-size:1rem;color:var(--tx);background:var(--bg);border:1.5px solid var(--line);border-radius:14px}
input:focus{outline:2px solid var(--g);border-color:transparent}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 14px}
.chip{padding:6px 12px;border:1.5px solid var(--line);border-radius:99px;background:none;font-size:.9rem}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:600}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.sum span:first-child small{color:var(--mut);margin-left:6px}
.total{margin-top:16px;width:100%;padding:16px;border:2px solid var(--g);border-radius:18px;background:none;display:flex;align-items:center;justify-content:space-between;font-size:1.5rem;font-weight:700;color:var(--gd)}
.hint{margin:6px 0 0;text-align:center;color:var(--mut);font-size:.8rem}
#chart{width:100%;height:auto;stroke:none}
#chart text{fill:var(--mut);font-size:11px;text-anchor:middle}
#chart rect{fill:var(--g)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="ib" id="bHist" aria-label="Verlauf"><svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V6M19 20v-10"/></svg></button>
  <h1>Geldbestie</h1>
  <button class="ib" id="bSum" aria-label="Abrechnung"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg></button>
</header>
<main id="list"></main>
<button class="fab" id="bAdd" aria-label="Ausgabe hinzufügen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<dialog id="dAdd">
  <form id="f" autocomplete="off">
    <h2>Neue Ausgabe</h2>
    <label>Betrag in €<input id="amt" inputmode="decimal" placeholder="0,00" pattern="[0-9]+([.,][0-9]{1,2})?" required></label>
    <label>Titel<input id="ttl" required maxlength="60"></label>
    <label>Kategorie<input id="cat" required maxlength="30" placeholder="Wählen oder neu eingeben"></label>
    <div id="chips"></div>
    <button class="primary">Speichern</button>
  </form>
</dialog>

<dialog id="dSum"><h2>Abrechnung</h2><div id="sumBody"></div></dialog>
<dialog id="dHist"><h2>Letzte 6 Monate</h2><svg id="chart" viewBox="0 0 320 170"></svg></dialog>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const read = (st, k, d) => { try { return JSON.parse(st.getItem(k)) ?? d } catch { return d } };
// Kategorien + Monatssummen bleiben auf dem Gerät; die Liste lebt nur bis die App geschlossen wird.
let cats = read(localStorage, 'gb_cats', []);
let hist = read(localStorage, 'gb_hist', {});
let items = read(sessionStorage, 'gb_items', []);
const save = () => {
  localStorage.setItem('gb_cats', JSON.stringify(cats));
  localStorage.setItem('gb_hist', JSON.stringify(hist));
  sessionStorage.setItem('gb_items', JSON.stringify(items));
};
const eur = n => n.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const monthKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const TRASH = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const COPY = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';

function toast(t) {
  const e = $('#toast'); e.textContent = t; e.classList.add('on');
  setTimeout(() => e.classList.remove('on'), 1500);
}

function render() {
  const list = $('#list'); list.replaceChildren();
  if (!items.length) {
    list.append(el('p', 'empty', 'Noch keine Ausgaben. Tippe unten auf Plus.'));
    return;
  }
  for (const it of items) {
    const r = el('div', 'row');
    r.append(el('b', '', it.title), el('span', 'cat', it.cat), el('span', 'amt', eur(it.amount)));
    const del = el('button'); del.innerHTML = TRASH; del.setAttribute('aria-label', 'Löschen');
    del.onclick = () => {
      items = items.filter(x => x.id !== it.id);
      hist[it.m] = Math.max(0, (hist[it.m] || 0) - it.amount);
      save(); render();
    };
    r.append(del);
    list.append(r);
  }
}

function openAdd() {
  $('#f').reset();
  const chips = $('#chips'); chips.replaceChildren();
  for (const c of cats) {
    const b = el('button', 'chip', c); b.type = 'button';
    b.onclick = () => { $('#cat').value = c; mark(); };
    chips.append(b);
  }
  $('#dAdd').showModal();
  $('#amt').focus();
}
const mark = () => document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.textContent === $('#cat').value.trim()));
$('#cat').oninput = mark;

$('#f').onsubmit = e => {
  e.preventDefault();
  const amount = Math.round(parseFloat($('#amt').value.replace(',', '.')) * 100) / 100;
  const cat = $('#cat').value.trim(), title = $('#ttl').value.trim();
  if (!(amount > 0) || !cat || !title) return;
  const m = monthKey(new Date());
  items.push({ id: Date.now(), amount, title, cat, m });
  hist[m] = (hist[m] || 0) + amount;
  if (!cats.includes(cat)) cats.push(cat);
  save(); render();
  $('#dAdd').close();
};

function openSum() {
  const b = $('#sumBody'); b.replaceChildren();
  if (!items.length) { b.append(el('p', 'empty', 'Nichts abzurechnen.')); $('#dSum').showModal(); return; }
  const by = {};
  for (const it of items) { by[it.cat] ??= { n: 0, sum: 0 }; by[it.cat].n++; by[it.cat].sum += it.amount; }
  for (const [c, v] of Object.entries(by).sort((a, b) => b[1].sum - a[1].sum)) {
    const r = el('div', 'sum');
    const l = el('span', '', c); l.append(el('small', '', v.n + (v.n === 1 ? ' Eintrag' : ' Einträge')));
    r.append(l, el('span', '', eur(v.sum)));
    b.append(r);
  }
  const total = items.reduce((s, i) => s + i.amount, 0);
  const t = el('button', 'total');
  t.append(el('span', '', eur(total)));
  t.insertAdjacentHTML('beforeend', COPY);
  t.onclick = async () => {
    const txt = total.toFixed(2).replace('.', ',');
    try { await navigator.clipboard.writeText(txt); toast('Kopiert: ' + txt); }
    catch { toast('Kopieren nicht möglich'); }
  };
  b.append(t, el('p', 'hint', 'Zum Kopieren auf den Betrag tippen'));
  $('#dSum').showModal();
}

function openHist() {
  const now = new Date(), data = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    data.push({ label: d.toLocaleDateString('de-DE', { month: 'short' }), v: hist[monthKey(d)] || 0 });
  }
  const max = Math.max(...data.map(d => d.v), 1);
  $('#chart').innerHTML = data.map((d, i) => {
    const h = Math.round(d.v / max * 110), x = 12 + i * 51;
    return `<rect x="${x}" y="${135 - h}" width="38" height="${Math.max(h, 2)}" rx="8"/>` +
      `<text x="${x + 19}" y="${128 - h}">${d.v ? Math.round(d.v) + ' €' : ''}</text>` +
      `<text x="${x + 19}" y="158">${d.label}</text>`;
  }).join('');
  $('#dHist').showModal();
}

$('#bAdd').onclick = openAdd;
$('#bSum').onclick = openSum;
$('#bHist').onclick = openHist;
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
